apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  # Shared NFS storage (runboat-nfs): no per-node attach/detach, pods can move
  # freely between nodes when the cluster autoscaler adds or removes nodes.
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
